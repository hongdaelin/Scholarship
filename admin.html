<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>참석 조사 관리자</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container container-wide">
    <header class="page-header">
      <p class="eyebrow">관리자 전용</p>
      <h1>참석 조사 응답 현황</h1>
    </header>

    <div id="config-warning" class="notice notice-error" hidden>
      Firebase 설정이 완료되지 않았습니다. <code>js/firebase-config.js</code> 파일을 수정해 주세요.
    </div>

    <form id="login-form" class="card narrow" hidden>
      <h2>관리자 로그인</h2>
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="notice notice-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">로그인</button>
    </form>

    <section id="dashboard" hidden>
      <div class="stats">
        <div class="stat"><span class="stat-label">전체 응답</span><span id="stat-total" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">참석</span><span id="stat-yes" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-label">불참</span><span id="stat-no" class="stat-value">0</span></div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="이름, 학교, 지역 검색">
        <select id="filter">
          <option value="all">전체</option>
          <option value="yes">참석만</option>
          <option value="no">불참만</option>
        </select>
        <button id="export-btn" type="button" class="btn btn-primary">엑셀 다운로드</button>
        <button id="logout-btn" type="button" class="btn">로그아웃</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>이름</th>
              <th>나이</th>
              <th>출신 고등학교</th>
              <th>재학 중인 대학교</th>
              <th>참석 여부</th>
              <th>출발 지역</th>
              <th>제출 일시</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="empty" hidden>표시할 응답이 없습니다.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
