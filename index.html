<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장학금 수여식 참석 조사</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <span class="chip">12월 12일 (토)</span>
      <h1>장학금 수여식 참석 조사</h1>
      <p>장학금 지급을 위해 아래 정보를 입력해 주세요.<br>입력하신 정보는 장학금 지급 및 행사 준비 목적으로만 사용됩니다.</p>
    </div>
  </header>

  <main class="container">
    <div id="config-warning" class="notice notice-error" hidden>
      Firebase 설정이 완료되지 않았습니다. <code>js/firebase-config.js</code> 파일을 수정해 주세요.
    </div>

    <form id="survey-form" novalidate>
      <section class="card">
        <h2 class="section-title"><span class="step">1</span>기본 정보</h2>
        <div class="grid grid-name">
          <div class="field">
            <label for="name">이름 <span class="req">*</span></label>
            <input id="name" name="name" type="text" maxlength="30" autocomplete="name" placeholder="홍길동" required>
          </div>
          <div class="field">
            <label for="age">나이 <span class="req">*</span></label>
            <input id="age" name="age" type="number" inputmode="numeric" min="10" max="99" placeholder="20" required>
          </div>
        </div>
        <div class="field">
          <label for="highSchool">출신 고등학교 <span class="req">*</span></label>
          <input id="highSchool" name="highSchool" type="text" maxlength="50" placeholder="예) 한국고등학교" required>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title"><span class="step">2</span>대학교 재학 여부</h2>
        <fieldset class="field">
          <legend class="sr-only">대학교 재학 여부</legend>
          <div class="segmented">
            <label><input type="radio" name="enrolled" value="yes" required><span>재학 중</span></label>
            <label><input type="radio" name="enrolled" value="no"><span>재학 중 아님</span></label>
          </div>
        </fieldset>
        <div id="university-section" class="reveal grid" hidden>
          <div class="field">
            <label for="university">대학교 <span class="req">*</span></label>
            <input id="university" name="university" type="text" maxlength="50" placeholder="예) 한국대학교">
          </div>
          <div class="field">
            <label for="major">학과 <span class="req">*</span></label>
            <input id="major" name="major" type="text" maxlength="50" placeholder="예) 경영학과">
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title"><span class="step">3</span>12월 12일 참석 여부</h2>
        <fieldset class="field">
          <legend class="sr-only">12월 12일 참석 여부</legend>
          <div class="segmented">
            <label><input type="radio" name="attending" value="yes" required><span>참석</span></label>
            <label><input type="radio" name="attending" value="no"><span>불참</span></label>
          </div>
        </fieldset>
        <div id="departure-section" class="reveal grid" hidden>
          <div class="field">
            <label for="departureProvince">출발 지역 (시·도) <span class="req">*</span></label>
            <select id="departureProvince" name="departureProvince">
              <option value="">선택해 주세요</option>
            </select>
          </div>
          <div id="city-field" class="field" hidden>
            <label for="departureDetail">출발 지역 (시·군) <span class="req">*</span></label>
            <select id="departureDetail" name="departureDetail">
              <option value="">선택해 주세요</option>
            </select>
          </div>
        </div>
      </section>

      <p id="form-error" class="notice notice-error" role="alert" hidden></p>

      <button id="submit-btn" type="submit" class="btn btn-primary btn-block">제출하기</button>
    </form>

    <section id="done" class="card done" hidden>
      <div class="done-icon" aria-hidden="true">✓</div>
      <h2>제출이 완료되었습니다</h2>
      <p>응답해 주셔서 감사합니다.<br>내용을 수정해야 하면 담당자에게 문의해 주세요.</p>
      <button id="again-btn" type="button" class="btn">다른 응답 작성하기</button>
    </section>
  </main>

  <script type="module" src="js/survey.js"></script>
</body>
</html>
